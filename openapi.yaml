      x-scope: platform
      responses:
        "200":
          description: Default Response
  /api/admin/bulk/sites.routes.upsert/execute:
    post:
      tags: *a1
      description: "Execute a plan of sites.routes.upsert: planHash must be the
        plan's, and planning again must give the same hash (409 plan_changed,
        with the new plan). Each item is checked again by its own guards right
        before it runs; per-item results in the job. Executing a plan again
        answers its job (resumed if its runner stopped). Needs sites:write."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - planId
                - planHash
              properties:
                planId:
                  type: string
                  maxLength: 64
                planHash:
                  type: string
                  maxLength: 64
