  /api/admin/sites/preview:
    post:
      tags: *a2
      description: Render an intent and run every check (gatekit compile + overlap
        against all live rules, ties, groups, host). Writes nothing; 503 when
        gatekit is unavailable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                site:
                  type: object
                  properties:
                    name:
                      type: string
                      pattern: ^[a-z][a-z0-9-]{1,39}$
                    displayName:
                      type: string
                      minLength: 1
                      maxLength: 80
                    description:
                      type: string
                      maxLength: 500
                    icon:
                      type: string
                      maxLength: 64
                    address:
                      type: object
                      properties:
                        host:
                          allOf:
                            - type: string
                              maxLength: 253
                            - type: string
                              pattern: ^(?=.{1,253}$)([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$
                        pathPrefix:
                          type: string
                          maxLength: 512
                          pattern: ^\/([A-Za-z0-9._~@-]+|:[A-Za-z_][A-Za-z0-9_]*|:any\*)?(\/([A-Za-z0-9._~@-]+|:[A-Za-z_][A-Za-z0-9_]*|:any\*))*$
                      required:
                        - host
                      additionalProperties: false
                    upstream:
                      type: object
                      properties:
                        service:
                          type: string
                          pattern: ^[a-z]([a-z0-9-]{0,61}[a-z0-9])?$
                        namespace:
                          type: string
                          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                        port:
                          type: integer
                          minimum: 1
                          maximum: 65535
                        scheme:
                          type: string
                          enum:
                            - http
                            - https
                        preserveHost:
                          type: boolean
                        stripPath:
                          type: string
                          maxLength: 256
                          pattern: ^\/[^\s]*$
                      required:
                        - service
                        - namespace
                        - port
                      additionalProperties: false
                    exposure:
                      type: object
                      properties:
                        mode:
                          type: string
                          enum:
                            - zone
                            - vanity
                      required:
                        - mode
                      additionalProperties: false
                      default:
                        mode: zone
                    gates:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            pattern: ^[a-z]([a-z0-9-]{0,20}[a-z0-9])?$
                          label:
                            type: string
                            minLength: 1
                            maxLength: 80
                          authenticators:
                            type: array
                            items:
                              type: object
                              properties:
                                handler:
                                  type: string
                                  pattern: ^[a-z][a-z0-9_]{1,40}$
                                config:
                                  type: object
                                  additionalProperties: {}
                              required:
                                - handler
                              additionalProperties: false
                            minItems: 1
                            maxItems: 8
                          authorizer:
                            anyOf:
                              - type: string
                                enum:
                                  - policy
                              - $ref: "#/properties/site/properties/gates/items/properties/authenticators/items"
                          mutators:
                            type: array
                            items:
                              $ref: "#/properties/site/properties/gates/items/properties/authenticators/items"
                            minItems: 1
                            maxItems: 8
                          errors:
                            anyOf:
                              - type: string
                                enum:
                                  - platform
                                  - website
                                  - api
                              - type: array
                                items:
                                  $ref: "#/properties/site/properties/gates/items/properties/authenticators/items"
                                minItems: 1
                                maxItems: 8
                          methods:
                            type: array
                            items:
                              type: string
                              enum:
                                - GET
                                - HEAD
                                - POST
                                - PUT
                                - PATCH
                                - DELETE
                                - OPTIONS
                            minItems: 1
                          preflight:
                            type: boolean
                          expert:
                            type: object
                            properties:
                              matchUrl:
                                type: string
                                minLength: 1
                                maxLength: 2048
                            additionalProperties: false
                        required:
                          - id
                          - label
                          - authenticators
                          - authorizer
                          - mutators
                          - errors
                        additionalProperties: false
                      minItems: 1
                      maxItems: 20
                    routes:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                pattern: ^[a-z][a-z0-9-]{0,31}$
                              methods:
                                type: array
                                items:
                                  $ref: "#/properties/site/properties/gates/items/properties/methods/items"
                                minItems: 1
                              path:
                                $ref: "#/properties/site/properties/address/properties/pathPrefix"
                              gate:
                                $ref: "#/properties/site/properties/routes/properties/items/items/properties/id"
                              access:
                                anyOf:
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                          - public
                                    required:
                                      - kind
                                    additionalProperties: false
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                          - signed-in
                                    required:
                                      - kind
                                    additionalProperties: false
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                          - permission
                                      permission:
                                        type: string
                                        pattern: ^[a-z][a-z0-9_.-]*:[a-z*][a-z0-9_*-]*$
                                    required:
                                      - kind
                                      - permission
                                    additionalProperties: false
                                  - type: object
                                    properties:
                                      kind:
                                        type: string
                                        enum:
                                          - deny
                                    required:
                                      - kind
                                    additionalProperties: false
                              orgParam:
                                type: string
                                pattern: ^[A-Za-z_][A-Za-z0-9_]*$
                              source:
                                type: string
                                enum:
                                  - manual
                                  - openapi
                                  - template
                                default: manual
                              pinned:
                                type: boolean
                              op:
                                type: string
                                minLength: 1
                                maxLength: 600
                            required:
                              - id
                              - methods
                              - path
                              - gate
                              - access
                            additionalProperties: false
                          maxItems: 2000
                        catchAll:
                          type: object
                          properties:
                            gate:
                              $ref: "#/properties/site/properties/routes/properties/items/items/properties/id"
                            access:
                              $ref: "#/properties/site/properties/routes/properties/items/items/properties/ac\
                                cess"
                          required:
                            - gate
                            - access
                          additionalProperties: false
                        openapi:
                          type: object
                          properties:
                            sha256:
                              type: string
                              pattern: ^[a-f0-9]{64}$
                            title:
                              type: string
                              maxLength: 200
                            version:
                              type: string
                              maxLength: 64
                            source:
                              type: string
                              enum:
                                - upload
                            importedAt:
                              type: string
                              format: date-time
                            importedBy:
                              type: string
                              maxLength: 254
                          required:
                            - sha256
                            - title
                            - version
                            - source
                            - importedAt
                            - importedBy
                          additionalProperties: false
                      required:
                        - items
                        - catchAll
                      additionalProperties: false
                    roles:
                      anyOf:
                        - type: string
                          enum:
                            - standard
                            - readonly
                            - operator
                        - type: object
                          additionalProperties:
                            type: array
                            items:
                              anyOf:
                                - $ref: "#/properties/site/properties/routes/properties/items/items/properties/ac\
                                    cess/anyOf/2/properties/permission"
                                - type: string
                                  enum:
                                    - "*"
                    groups:
                      type: object
                      properties:
                        platform:
                          type: object
                          additionalProperties:
                            type: array
                            items:
                              type: string
                        orgGrantable:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              label:
                                type: string
                                minLength: 1
                                maxLength: 80
                              roles:
                                type: array
                                items:
                                  type: string
                                minItems: 1
                            required:
                              - label
                              - roles
                            additionalProperties: false
                      required:
                        - platform
                        - orgGrantable
                      additionalProperties: false
                    orgs:
                      type: array
                      items:
                        type: string
                        format: uuid
                      maxItems: 500
                    everyOrg:
                      type: object
                      additionalProperties:
                        type: array
                        items:
                          $ref: "#/properties/site/properties/routes/properties/items/items/properties/ac\
                            cess/anyOf/2/properties/permission"
                        maxItems: 200
                    login:
                      type: object
                      properties:
                        twoFactor:
                          type: object
                          properties:
                            scope:
                              type: string
                              enum:
                                - none
                                - writes
                                - all
                                - routes
                            routes:
                              type: array
                              items:
                                $ref: "#/properties/site/properties/routes/properties/items/items/properties/id"
                              maxItems: 2000
                            clients:
                              type: string
                              enum:
                                - exempt
                                - refused
