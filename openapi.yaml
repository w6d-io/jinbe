  /api/admin/settings/second-factor:
    get:
      tags:
        - second-factor
      description: Groups whose members must set up a second factor at sign-in and
        hold aal2 on every permission-carrying route.
      x-permission: settings:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: string
                  defaultGroups:
                    type: array
                    items:
                      type: string
    put:
      tags:
        - second-factor
      description: Replace the groups whose members must use two-step sign-in. Every
        name must be an existing group; an empty list turns every group off.
        Sets each group's "Members must use 2FA" switch (listed on, others off);
        published to OPA as data.second_factor. groups.mfa:write (super admin
        alone), with a second factor proven within 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - groups
              additionalProperties: false
              properties:
                groups:
                  type: array
                  maxItems: 200
                  items:
                    type: string
                    maxLength: 100
      x-permission: groups.mfa:write
      x-scope: platform
      x-step-up: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups:
                    type: array
                    items:
                      type: string
                  defaultGroups:
                    type: array
                    items:
                      type: string
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
  /api/admin/rbac/second-factor-map:
    get:
      tags:
        - second-factor
      description: "Every second-factor rule and what it applies to: sign-in groups
        (group_sign_in), groups that need enrolment before joining, permissions
        needing a recent second factor (step_up, with personal-key stand-in and
        four-eyes), staff roles, each site's two-step bar (site_login).
