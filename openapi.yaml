                            - pre-restore
                            - pre-rollback
                        counts:
                          type: object
                          additionalProperties:
                            type: number
  /api/admin/rbac/bundle/history/{id}/rollback:
    post:
      tags:
        - rbac
        - backup
      description: Restore the RBAC config snapshot of a history entry (full replace).
        The current state is snapshotted first (reason 'pre-rollback'), so a
        rollback is itself reversible.
