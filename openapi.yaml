  /api/admin/audit/metrics:
    get:
      tags:
        - audit
      description: Prometheus metrics for audit events and HTTP requests
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: string
  /api/admin/audit/events:
    get:
      tags:
        - audit
      description: Query audit events (newest first). Rich schema — maps directly to UI.
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: query
          name: since
          required: false
          description: Stream ID lower bound ("-" = oldest)
        - schema:
            type: string
          in: query
          name: until
          required: false
          description: Stream ID upper bound ("+" = newest)
        - schema:
            type: string
          in: query
          name: cursor
          required: false
          description: Exclusive upper-bound stream ID for pagination
        - schema:
            type: string
            enum:
              - auth
              - access
              - rbac
              - policy
              - service
              - route
              - secret
              - system
          in: query
          name: category
          required: false
        - schema:
            type: string
          in: query
          name: actor
          required: false
          description: Actor email — reads the per-actor trail
        - schema:
            type: string
          in: query
          name: service
          required: false
          description: Service name — reads the per-service trail
        - schema:
            type: string
          in: query
          name: target
          required: false
          description: Target email — reads the "done-to" trail
        - schema:
            type: string
            enum:
              - ok
              - applied
              - denied
              - failed
              - error
          in: query
          name: result
          required: false
        - schema:
            type: string
          in: query
          name: verb
          required: false
        - schema:
            type: string
            enum:
              - change
              - access
              - auth
              - system
              - security
          in: query
          name: kind
          required: false
        - schema:
            type: integer
          in: query
          name: from
          required: false
          description: ms epoch lower bound
        - schema:
            type: integer
          in: query
          name: to
          required: false
          description: ms epoch upper bound
        - schema:
            type: string
          in: query
          name: q
          required: false
          description: free-text substring over target/actor/reason
        - schema:
            type: string
            enum:
              - high
          in: query
          name: risk
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: number
                  nextCursor:
                    type: string
                    nullable: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
