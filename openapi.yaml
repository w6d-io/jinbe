openapi: 3.1.0
info:
  title: Jinbe API
  description: |-
    Jinbe API for Kubernetes cluster and database management.

    ## Authentication
    Most endpoints require authentication via the `ory_kratos_session` cookie.
    Use the **Authorize** button to set your session cookie value.

    Public endpoints (no auth required):
    - `GET /api/health`
    - `GET /api/whoami`
  version: 1.0.0
  contact:
    name: Jinbe Team
components:
  securitySchemes:
    kratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: Ory Kratos session cookie. Get this from your browser after logging in.
  schemas:
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Valid authentication required. Please provide a valid
            ory_kratos_session cookie.
paths:
  /api/health:
    get:
      tags:
        - health
      description: Health check endpoint
      responses:
        "200":
          description: Default Response
  /scim/v2/ServiceProviderConfig:
    get:
      tags:
        - scim
      description: SCIM 2.0 service provider configuration (RFC 7643 §5).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/ResourceTypes:
    get:
      tags:
        - scim
      description: SCIM 2.0 resource types (RFC 7643 §6). Users only in phase 1.
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Schemas:
    get:
      tags:
        - scim
      description: SCIM 2.0 schema definitions (RFC 7643 §7).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Users:
    get:
      tags:
        - scim
      description: List/filter SCIM users. Supports filter=userName eq "..." /
        externalId eq "..." and startIndex/count pagination.
      parameters:
        - schema:
            type: string
          in: query
          name: filter
          required: false
        - schema:
            type: integer
          in: query
          name: startIndex
          required: false
        - schema:
            type: integer
          in: query
          name: count
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags:
        - scim
      description: Create a SCIM user (Kratos identity, default group [users],
        scim.managed marking). 409 uniqueness on existing email.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Users/{id}:
    get:
      tags:
        - scim
      description: Get a SCIM user by Kratos identity id.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags:
        - scim
      description: Replace a SCIM user (traits + active state; groups preserved).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      tags:
        - scim
      description: "PATCH a SCIM user (RFC 7644 PatchOp): active true/false at
        minimum, plus userName/name/externalId. active=false revokes sessions."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      tags:
        - scim
      description: "Soft-delete a SCIM user: state → inactive + all sessions revoked.
        The Kratos identity is NEVER deleted (audit/grant provenance)."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/whoami:
    get:
      tags:
        - auth
      description: Return the current user identity (from Kratos session) and RBAC
        info (groups, roles, permissions) from OPAL
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  email:
                    type:
                      - "null"
                      - string
                  name:
                    type:
                      - "null"
                      - string
                    description: User display name
                  picture:
                    type:
                      - "null"
                      - string
                    description: User avatar URL
                  identity_id:
                    type:
                      - "null"
                      - string
                  session_id:
                    type:
                      - "null"
                      - string
                  error:
                    type:
                      - "null"
                      - string
                  groups:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  rules_source:
                    type: string
                    enum:
                      - service
                      - gitops
  /api/me/organizations:
    get:
      tags:
        - me
      description: List the organizations the current user may administer
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: string
                  names:
                    type: object
                    additionalProperties:
                      type: string
                  scope:
                    type: string
                    enum:
                      - all
                      - delegated
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /api/clusters/:
    get:
      tags:
        - clusters
      description: Get all clusters with optional pagination
      parameters:
        - schema:
            type: string
          in: query
          name: withConfig
          required: false
        - schema:
            type: string
          in: query
          name: withDatabase
          required: false
        - schema:
            type: string
          in: query
          name: page
          required: false
        - schema:
            type: string
          in: query
          name: pageSize
          required: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        config:
                          type: string
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                        databases:
                          type: array
                          nullable: true
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                              type:
                                type: string
                              host:
                                type: string
                              port:
                                type: number
                              username:
                                type: string
                        _count:
                          type: object
                          properties:
                            databases:
                              type: number
                            backups:
                              type: number
                    description: Array response (when pagination not requested)
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                            config:
                              type: string
                            createdAt:
                              type: string
                              format: date-time
                            updatedAt:
                              type: string
                              format: date-time
                            databases:
                              type: array
                              nullable: true
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                  type:
                                    type: string
                                  host:
                                    type: string
                                  port:
                                    type: number
                                  username:
                                    type: string
                            _count:
                              type: object
                              properties:
                                databases:
                                  type: number
                                backups:
                                  type: number
                      meta:
                        type: object
                        properties:
                          page:
                            type: number
                            example: 1
                          pageSize:
                            type: number
                            example: 10
                          totalItems:
                            type: number
                            example: 42
                          totalPages:
                            type: number
                            example: 5
                          hasNextPage:
                            type: boolean
                            example: true
                          hasPreviousPage:
                            type: boolean
                            example: false
                    description: Paginated response (when page/pageSize provided)
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
    post:
      tags:
        - clusters
      description: Create new cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                config:
                  type: string
                  minLength: 1
                databases:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - postgresql
                          - mongodb
                          - influxdb
                      host:
                        type: string
                        minLength: 1
                      port:
                        type: number
                        exclusiveMinimum: 0
                      username:
                        type: string
                        minLength: 1
                      password:
                        type: string
                        minLength: 1
                      api:
                        type: object
                        properties:
                          address:
                            type: string
                            format: uri
                          api_key:
                            type: string
                            minLength: 1
                        required:
                          - address
                          - api_key
                        additionalProperties: false
                    required:
                      - type
                      - host
                      - port
                      - username
                      - password
                    additionalProperties: false
              required:
                - name
                - config
              additionalProperties: false
        required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  config:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
  /api/clusters/{id}:
    get:
      tags:
        - clusters
      description: Get cluster by ID
      parameters:
        - schema:
            type: string
          in: query
          name: withConfig
          required: false
        - schema:
            type: string
          in: query
          name: withDatabase
          required: false
        - schema:
            type: string
          in: query
          name: page
          required: false
        - schema:
            type: string
          in: query
          name: pageSize
          required: false
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  config:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
                  databases:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        host:
                          type: string
                        port:
                          type: number
                        username:
                          type: string
                  _count:
                    type: object
                    properties:
                      databases:
                        type: number
                      backups:
                        type: number
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    put:
      tags:
        - clusters
      description: Update cluster by ID
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                config:
                  type: string
                databases:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^[0-9a-fA-F]{24}$
                      type:
                        type: string
                        enum:
                          - postgresql
                          - mongodb
                          - influxdb
                      host:
                        type: string
                        minLength: 1
                      port:
                        type: number
                        exclusiveMinimum: 0
                      username:
                        type: string
                        minLength: 1
                      password:
                        type: string
                        minLength: 1
                      api:
                        type: object
                        properties:
                          address:
                            type: string
                            format: uri
                          api_key:
                            type: string
                            minLength: 1
                        required:
                          - address
                          - api_key
                        additionalProperties: false
                    required:
                      - id
                      - type
                      - host
                      - port
                      - username
                      - password
                    additionalProperties: false
              additionalProperties: false
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  config:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
    delete:
      tags:
        - clusters
      description: Delete cluster by ID
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  config:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
  /api/clusters/{id}/databases:
    post:
      tags:
        - databases
      description: Create new database under a specific cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - postgresql
                    - mongodb
                    - influxdb
                host:
                  type: string
                  minLength: 1
                port:
                  type: number
                  exclusiveMinimum: 0
                username:
                  type: string
                  minLength: 1
                password:
                  type: string
                  minLength: 1
                api:
                  type: object
                  properties:
                    address:
                      type: string
                      format: uri
                    api_key:
                      type: string
                      minLength: 1
                  required:
                    - address
                    - api_key
                  additionalProperties: false
              required:
                - type
                - host
                - port
                - username
                - password
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                    enum:
                      - postgresql
                      - mongodb
                      - influxdb
                  host:
                    type: string
                  port:
                    type: number
                  username:
                    type: string
                  clusterId:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
  /api/clusters/{id}/backups:
    post:
      tags:
        - backups
      description: Create new backup under a specific cluster
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                database_type:
                  type: string
                  minLength: 1
                date:
                  anyOf:
                    - type: string
                    - type: string
                      format: date-time
                size:
                  type: string
                  minLength: 1
                backupItems:
                  type: array
                  items:
                    type: object
                    properties:
                      database_type:
                        type: string
                      name:
                        type: string
                      admin_username:
                        type: string
                      username:
                        type: string
                      filename:
                        type: string
                      size:
                        type: string
                    required:
                      - database_type
                      - name
                      - admin_username
                      - username
                      - filename
                    additionalProperties: false
                  minItems: 1
              required:
                - database_type
                - date
                - size
                - backupItems
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  database_type:
                    type: string
                  date:
                    type: string
                    format: date-time
                  size:
                    type: string
                  clusterId:
                    type: string
                  backupItemCount:
                    type: number
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
  /api/clusters/verify:
    post:
      tags:
        - clusters
      description: Verify a kubeconfig and retrieve token identity/permissions. Use
        this before creating a cluster to validate the configuration.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - config
              properties:
                config:
                  type: string
                  description: The kubeconfig YAML content to verify
        required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                      server:
                        type: string
                      version:
                        type: string
                  user:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                      authMethod:
                        type: string
                        enum:
                          - token
                          - client-certificate
                          - exec
                          - auth-provider
                          - unknown
                  identity:
                    type: object
                    nullable: true
                    properties:
                      username:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                      uid:
                        type: string
                  permissions:
                    type: object
                    nullable: true
                    properties:
                      canListNamespaces:
                        type: boolean
                      canListPods:
                        type: boolean
                      canCreateJobs:
                        type: boolean
                      canListSecrets:
                        type: boolean
                      namespaces:
                        type: array
                        items:
                          type: string
                  error:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
  /api/clusters/{id}/verify:
    post:
      tags:
        - clusters
      description: Verify the kubeconfig of an existing cluster and retrieve token
        identity/permissions
      parameters:
        - schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  cluster:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                      server:
                        type: string
                      version:
                        type: string
                  user:
                    type: object
                    nullable: true
                    properties:
                      name:
                        type: string
                      authMethod:
                        type: string
                        enum:
                          - token
                          - client-certificate
                          - exec
                          - auth-provider
                          - unknown
                  identity:
                    type: object
                    nullable: true
                    properties:
                      username:
                        type: string
                      groups:
                        type: array
                        items:
                          type: string
                      uid:
                        type: string
                  permissions:
                    type: object
                    nullable: true
                    properties:
                      canListNamespaces:
                        type: boolean
                      canListPods:
                        type: boolean
                      canCreateJobs:
                        type: boolean
                      canListSecrets:
                        type: boolean
                      namespaces:
                        type: array
                        items:
                          type: string
                  error:
                    type: string
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  error:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/databases/:
    get:
      tags:
        - databases
      description: Get all databases (optionally filtered by clusterId, with pagination)
      parameters:
        - schema:
            type: string
          in: query
          name: clusterId
          required: false
          description: Filter by cluster ID
        - schema:
            type: integer
            minimum: 1
            default: 1
          in: query
          name: page
          required: false
          description: Page number (starts at 1)
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
