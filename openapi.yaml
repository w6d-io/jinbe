  /api/admin/recert/campaigns:
    post:
      tags:
        - recert
      description: "Create a recertification campaign (draft). Phase 1: explicit
        reviewer emails, one-shot schedule."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - reviewers
                - deadline
                - onExpiry
              properties:
                name:
                  type: string
                  minLength: 1
                scope:
                  type: object
                  properties:
                    groups:
                      type: array
                      items:
                        type: string
                  additionalProperties: false
                reviewers:
                  type: array
                  items:
                    type: string
                    format: email
                  minItems: 1
                deadline:
                  type: string
                onExpiry:
                  type: string
                  enum:
                    - revoke
                    - flag
        required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    get:
      tags:
        - recert
      description: List recertification campaigns with item progress (newest first).
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/admin/recert/campaigns/{id}:
    get:
      tags:
        - recert
      description: Get a campaign with its review items.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    delete:
      tags:
        - recert
      description: Delete a campaign. Draft/archived only — completed campaigns and
        their frozen reports are audit evidence.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
  /api/admin/recert/campaigns/{id}/activate:
    post:
      tags:
        - recert
      description: "Activate a draft campaign: walk groups→members via Kratos and
        generate one review item per (user, group) in scope."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
                  itemCount:
                    type: number
  /api/admin/recert/campaigns/{id}/close:
    post:
      tags:
        - recert
      description: "Close an active campaign now: pending items get the onExpiry
        consequence (revoke → membership removed in Kratos, flag → marked) and
        the completion report is frozen."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
