                  description: Optional token audience
              additionalProperties: false
        required: true
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: organizationId
          required: true
          description: Organization identifier
      responses:
        "201":
          description: Returned ONCE on creation. Copy the client_secret now — it cannot
            be retrieved again.
