              schema:
                type: object
                additionalProperties: true
  /api/admin/rbac/bundle/import:
    post:
      tags:
        - rbac
        - backup
      description: Import an auth bundle — restores RBAC config. Body must be a full
        snapshot; ?sections=services,groups,… applies only those parts
        (override/add, no prune), omitted = full 1:1 restore. 409 (nothing
        written) when the resulting route maps tie two services on one route at
        the same specificity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - schema:
            type: string
          in: query
          name: sections
          required: false
      x-permission: policy.bundle:write
      x-scope: platform
      x-step-up: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  imported:
                    type: object
                    additionalProperties: true
