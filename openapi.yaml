                    defaultGate:
                      type: string
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                  additionalProperties: false
                  default: {}
                decisions:
                  type: array
                  items:
                    type: object
                    properties:
                      op:
                        type: string
                        minLength: 1
                        maxLength: 600
                      access:
                        anyOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - public
                            required:
                              - kind
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - signed-in
                            required:
                              - kind
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - permission
                              permission:
                                type: string
                                pattern: ^[a-z][a-z0-9_.-]*:[a-z*][a-z0-9_*-]*$
                            required:
                              - kind
                              - permission
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - deny
                            required:
                              - kind
                            additionalProperties: false
                      gate:
                        $ref: "#/properties/options/properties/defaultGate"
                      orgParam:
                        allOf:
                          - $ref: "#/properties/options/properties/orgParam"
                        nullable: true
                      skip:
                        type: boolean
                      remove:
                        type: boolean
                      confirm:
                        type: boolean
                    required:
                      - op
                    additionalProperties: false
                  maxItems: 2000
                  default: []
                acceptDenied:
                  type: boolean
                  default: false
              required:
                - specSha256
                - baseEtag
              additionalProperties: false
      x-permission: sites:write
