  /api/home/{module}:
    get:
      tags: *a7
      description: One Home module (retry after unavailable, or refresh a single
        tile). 403 with status "forbidden" for a module the caller may not see.
      parameters:
        - schema:
            type: string
            enum:
              - 24h
              - 7d
            default: 24h
          in: query
          name: window
          required: false
        - schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
          in: query
          name: org
          required: false
        - schema:
            type: string
            enum:
              - health
              - attention
              - people
              - activity
              - access
              - sites
              - changes
              - actions
              - me
          in: path
          name: module
          required: true
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - unavailable
                      - forbidden
                  reason:
                    type: string
                    enum:
                      - warming
                      - timeout
                      - source_down
                      - not_configured
                      - not_deployed
                  asOf:
                    type: string
                    nullable: true
                  stale:
                    type: boolean
                  sources:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        state:
                          type: string
