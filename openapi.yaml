  /api/admin/rbac/access-check:
    post:
      tags:
        - rbac
      description: "Ask OPA whether a user may call METHOD PATH and why: the gateway
        verdict (rbac.decision) plus the owning service, the route rules that
        matched, and the groups, roles and permissions that applied
        (rbac.simulate). `owners` with two or more services is a route tie,
        which the policy answers not_found. Requires access:check. 503 when
        OPA_URL / OPA_TOKEN are not configured; 502 when OPA does not answer."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - method
                - path
              properties:
                email:
                  type: string
                  format: email
                method:
                  type: string
                  description: GET, POST, PUT, PATCH, DELETE, HEAD or OPTIONS (any case)
                path:
                  type: string
                  description: Absolute request path, no query string, e.g. /api/clusters/42
                app:
                  type: string
                  description: Pin the service instead of letting the policy resolve the owner
                aal:
                  type: string
                  enum:
                    - aal1
                    - aal2
                  description: "Sign-in level to judge at: aal1 (password) or aal2 (second
                    factor). Unset: no level"
      x-permission: access:check
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  allow:
                    type: boolean
                  reason:
                    type: string
                    enum:
                      - ok
                      - not_found
                      - forbidden
                      - forbidden_org
                      - needs_2fa
                  app:
                    type:
                      - "null"
                      - string
                  owners:
                    type: array
                    items:
                      type: string
                  matchingRules:
                    type: array
                    items:
                      type: object
                      properties:
                        method:
                          type: string
                        path:
                          type: string
                        permission:
                          type: string
                  groups:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  aal:
                    type: string
                    enum:
                      - aal1
                      - aal2
                  stepUp:
                    type: object
                    description: "Only with reason needs_2fa: the sign-in level is the one failing
                      condition"
                    properties:
                      requiredAal:
                        type: string
                        enum:
                          - aal2
                      allowedAtAal2:
                        type: boolean
                      requiredBy:
                        type: array
                        items:
                          type: string
                          enum:
                            - site
                            - platform_group
                required:
                  - allow
                  - reason
                  - app
                  - owners
                  - matchingRules
                  - groups
                  - roles
                  - permissions
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Bad Request
                  message:
                    type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "403":
