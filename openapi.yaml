        - sites
      description: "Read an OpenAPI 2.0/3.0/3.1 document (content only; URL import is
        not available yet) and propose one route per operation: access, gate,
        org parameter, risk, re-import diff against the draft. Writes nothing
        but the uploaded bytes, kept 24 h for the commit"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source:
                  anyOf:
                    - type: object
                      properties:
                        content:
                          type: string
                          minLength: 1
                          maxLength: 5242880
                        format:
                          type: string
                          enum:
                            - auto
                            - json
                            - yaml
                          default: auto
                      required:
                        - content
                      additionalProperties: false
                    - type: object
                      properties:
                        url:
                          type: string
                          minLength: 1
                          maxLength: 2048
                      required:
                        - url
                      additionalProperties: false
                options:
                  type: object
                  properties:
                    basePath:
                      type: string
                      maxLength: 256
                      pattern: ^(\/[A-Za-z0-9._~@-]+)*$
                    basePathMode:
                      type: string
                      enum:
                        - prepend
                        - strip
                        - none
                      default: prepend
                    resourceFrom:
                      type: string
                      enum:
                        - tag
                        - path
                        - operationId
                      default: tag
                    listAsRead:
                      type: boolean
                      default: false
                    scopeMap:
                      type: object
                      additionalProperties:
                        type: string
                        maxLength: 128
                        pattern: ^[a-z][a-z0-9_.-]*:[a-z*][a-z0-9_*-]*$
                    orgParam:
                      type: string
                      pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
                    defaultGate:
                      type: string
                      pattern: ^[a-z][a-z0-9-]{0,31}$
                  additionalProperties: false
                  default: {}
                decisions:
                  type: array
                  items:
                    type: object
                    properties:
                      op:
                        type: string
                        minLength: 1
                        maxLength: 600
                      access:
                        anyOf:
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - public
                            required:
                              - kind
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - signed-in
                            required:
                              - kind
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - permission
                              permission:
                                type: string
                                pattern: ^[a-z][a-z0-9_.-]*:[a-z*][a-z0-9_*-]*$
                            required:
                              - kind
                              - permission
                            additionalProperties: false
                          - type: object
                            properties:
                              kind:
                                type: string
                                enum:
                                  - deny
                            required:
                              - kind
                            additionalProperties: false
                      gate:
                        $ref: "#/properties/options/properties/defaultGate"
                      orgParam:
                        allOf:
                          - $ref: "#/properties/options/properties/orgParam"
                        nullable: true
                      skip:
                        type: boolean
                      remove:
                        type: boolean
                      confirm:
                        type: boolean
                    required:
                      - op
                    additionalProperties: false
                  maxItems: 2000
                  default: []
              required:
                - source
              additionalProperties: false
      x-permission: sites:write
      x-scope: platform
      parameters:
        - schema:
            type: string
          in: path
          name: name
          required: true
      responses:
        "200":
          description: Default Response
