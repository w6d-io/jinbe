openapi: 3.1.0
info:
  title: Jinbe API
  description: |-
    Jinbe API: identities, groups and permissions, sites and the gateway, audit.

    ## Authentication
    Most endpoints require authentication via the `ory_kratos_session` cookie.
    Use the **Authorize** button to set your session cookie value.

    Public endpoints (no auth required):
    - `GET /api/health`
    - `GET /api/whoami`
  version: 1.0.0
  contact:
    name: Jinbe Team
components:
  securitySchemes:
    kratosSession:
      type: apiKey
      in: cookie
      name: ory_kratos_session
      description: Ory Kratos session cookie. Get this from your browser after logging in.
  schemas:
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
          example: Unauthorized
        message:
          type: string
          example: Valid authentication required. Please provide a valid
            ory_kratos_session cookie.
paths:
  /api/health:
    get:
      tags:
        - health
      description: Health check endpoint
      x-access: public
      responses:
        "200":
          description: Default Response
  /scim/v2/ServiceProviderConfig:
    get:
      tags:
        - scim
      description: SCIM 2.0 service provider configuration (RFC 7643 §5).
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/ResourceTypes:
    get:
      tags:
        - scim
      description: SCIM 2.0 resource types (RFC 7643 §6). Users only in phase 1.
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Schemas:
    get:
      tags:
        - scim
      description: SCIM 2.0 schema definitions (RFC 7643 §7).
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Users:
    get:
      tags:
        - scim
      description: List/filter SCIM users. Supports filter=userName eq "..." /
        externalId eq "..." and startIndex/count pagination.
      parameters:
        - schema:
            type: string
          in: query
          name: filter
          required: false
        - schema:
            type: integer
          in: query
          name: startIndex
          required: false
        - schema:
            type: integer
          in: query
          name: count
          required: false
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags:
        - scim
      description: Create a SCIM user (Kratos identity, default group [users],
        scim.managed marking). 409 uniqueness on existing email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      x-access: machine
      x-edge: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /scim/v2/Users/{id}:
    get:
      tags:
        - scim
      description: Get a SCIM user by Kratos identity id.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      tags:
        - scim
      description: Replace a SCIM user (traits + active state; groups preserved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    patch:
      tags:
        - scim
      description: "PATCH a SCIM user (RFC 7644 PatchOp): active true/false at
        minimum, plus userName/name/externalId. active=false revokes sessions."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    delete:
      tags:
        - scim
      description: "Soft-delete a SCIM user: state → inactive + all sessions revoked.
        The Kratos identity is NEVER deleted (audit/grant provenance)."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-access: machine
      x-edge: true
      responses:
        "200":
          description: Default Response
  /.well-known/oauth-authorization-server:
    get:
      tags:
        - oauth
      description: RFC 8414 authorization-server metadata for MCP clients, on the
        Hydra host only (MCP_OAUTH_ISSUER). The issuer is Hydra's verbatim; PKCE
        S256 only, public clients, registration at <issuer>/oauth2/register.
      x-access: public
      responses:
        "200":
          description: Default Response
  /oauth2/register:
    post:
      tags:
        - oauth
      description: Register an MCP client (RFC 7591 subset), on the Hydra host only.
        Loopback http redirect URIs with an explicit port (localhost, 127.0.0.1,
        [::1]), a public client (none), authorization_code + refresh_token. The
        audience, lifetimes and metadata are forced; no secret and no
        registration access token are issued. 403 access_denied when MCP or
        browser sign-in is off; 429 over the per-network or daily limit; 503
        when too many registrations await consent.
      x-access: public
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_id:
                    type: string
                  client_id_issued_at:
                    type: integer
                  client_name:
                    type: string
                  redirect_uris:
                    type: array
                    items:
                      type: string
                  grant_types:
                    type: array
                    items:
                      type: string
                  response_types:
                    type: array
                    items:
                      type: string
                  token_endpoint_auth_method:
                    type: string
                  scope:
                    type: string
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  error_description:
                    type: string
  /api/telemetry:
    get:
      tags:
        - health
      description: Browser telemetry settings. Empty when none is configured.
      x-access: public
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  faroUrl:
                    type: string
                  serviceName:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
  /api/whoami:
    get:
      tags:
        - auth
      description: Return the current user identity (from Kratos session) and RBAC
        info (groups, roles, permissions) from OPAL
      x-access: public
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  email:
                    type:
                      - "null"
                      - string
                  name:
                    type:
                      - "null"
                      - string
                    description: User display name
                  picture:
                    type:
                      - "null"
                      - string
                    description: User avatar URL
                  identity_id:
                    type:
                      - "null"
                      - string
                  session_id:
                    type:
                      - "null"
                      - string
                  error:
                    type:
                      - "null"
                      - string
                  groups:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  effective_permissions:
                    type: array
                    items:
                      type: string
                  rules_source:
                    type: string
                    enum:
                      - service
                      - gitops
  /api/catalog:
    get:
      tags:
        - auth
      description: The permission catalogue (scope, labels, sensitivity, step-up and
        its rule, four-eyes, delegable, routes), the staff roles (with their
        every-org permissions) and jinbe's org roles.
      x-access: authenticated
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        scope:
                          type: string
                          enum:
                            - platform
                            - org
                        area:
                          type: string
                        label:
                          type: string
                        sensitivity:
                          type: string
                          enum:
                            - low
                            - medium
                            - high
                            - critical
                        stepUp:
                          type: boolean
                        fourEyes:
                          type:
                            - string
                            - boolean
                        delegable:
                          type: string
                          enum:
                            - direct
                            - never
                        stepUpRule:
                          type: object
                          description: "required: a second factor proven within maxAgeMin minutes;
                            viaPersonalKey: a personal key may stand in with the
                            factor proven at its creation, up to maxAgeDays
                            (null: it may not); viaOAuthGrant: an OAuth grant
                            may stand in with the factor proven at consent when
                            the user allowed protected actions, for maxAgeHours
                            (the MCP setting named); fourEyes: a second person
                            in prod."
                          properties:
                            required:
                              type: boolean
                            maxAgeMin:
                              type: integer
                              nullable: true
                            viaPersonalKey:
                              type: object
                              nullable: true
                              properties:
                                maxAgeDays:
                                  type: integer
                            viaOAuthGrant:
                              type: object
                              nullable: true
                              properties:
                                maxAgeHours:
                                  type: integer
                                setting:
                                  type: string
                                requiresConsentOptIn:
                                  type: boolean
                            fourEyes:
                              type:
                                - string
                                - boolean
                        routes:
                          type: array
                          items:
                            type: object
                            properties:
                              method:
                                type: string
                              path:
                                type: string
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        group:
                          type: string
                        label:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
                        everyOrg:
                          type: array
                          items:
                            type: string
                          description: Org permissions it holds in every organisation
                        stepUpPermissions:
                          type: array
                          items:
                            type: string
                          description: Its permissions that need a recent second factor
                  orgRoles:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: svc:role, as assigned in an organisation
                        label:
                          type: string
                        permissions:
                          type: array
                          items:
                            type: string
  /api/me/permissions:
    get:
      tags:
        - me
      description: "The caller's effective permissions across the platform, which
        user-management actions they allow, and their second-factor picture
        (secondFactor: requiredBecause groups, enrolled, currentAal,
        factorAgeMin, stepUpFresh, stepUpPermissions)."
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: string
                  groups:
                    type: array
                    items:
                      type: string
                  roles:
                    type: array
                    items:
                      type: string
                  permissions:
                    type: array
                    items:
                      type: string
                  actions:
                    type: object
                    additionalProperties:
                      type: boolean
                  orgPermissions:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  secondFactor:
                    type: object
                    nullable: true
                    description: "required/requiredBecause: the groups that make two-step sign-in
                      (aal2) mandatory; enrolled/methods: null when unread;
                      currentAal, factorAgeMin, stepUpFresh: the caller's own
                      session (null when describing somebody else);
                      stepUpPermissions: their permissions that need a second
                      factor proven within 15 minutes (null when unread)."
                    properties:
                      required:
                        type: boolean
                      requiredBecause:
                        type: array
                        items:
                          type: string
                      enrolled:
                        type: boolean
                        nullable: true
                      methods:
                        type: array
                        nullable: true
                        items:
                          type: string
                      currentAal:
                        type: string
                        nullable: true
                      factorAgeMin:
                        type: integer
                        nullable: true
                      stepUpFresh:
                        type: boolean
                        nullable: true
                      stepUpPermissions:
                        type: array
                        nullable: true
                        items:
                          type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /api/me/organizations:
    get:
      tags:
        - me
      description: List the organizations the current user may administer
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations:
                    type: array
                    items:
                      type: string
                  names:
                    type: object
                    additionalProperties:
                      type: string
                  scope:
                    type: string
                    enum:
                      - delegated
                      - claim
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /api/me/api-keys/:
    get:
      tags:
        - api-keys
      description: Your personal API keys (no secrets).
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        client_id:
                          type: string
                        organization_id:
                          type: string
                          nullable: true
                          description: "null: a personal key belongs to no organization (older keys may
                            still name one; it means nothing now)"
                        label:
                          type: string
                        scopes:
                          type: array
                          items:
                            type: string
                        created_by:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          format: date-time
                          nullable: true
                        expires_at:
                          type: string
                          format: date-time
                          nullable: true
                        last_used_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: Last use, to the minute; null when never seen
                        created_by_email:
                          type: string
                          nullable: true
                          description: The creator, when you are them or may see users
                        kind:
                          type: string
                          enum:
                            - personal
                        all_permissions:
                          type: boolean
                          description: The key carries all your permissions as they are at each call;
                            `scopes` is then empty
                  total:
                    type: number
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                  code:
                    type: string
                    example: insufficient_scope
                  reason:
                    type: string
                    example: scope_missing:users:recovery
                  permission:
                    type: string
                    example: users:reset_second_factor
                  missing:
                    type: array
                    items:
                      type: string
                    example:
                      - users:reset_second_factor
                  missingByScope:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  grantedBy:
                    type: array
                    items:
                      type: string
                    example:
                      - staff-security
                      - super_admins
                  reasons:
                    type: array
                    items:
                      type: string
                    example:
                      - missing_every_org_permissions
                      - missing_permissions
                  hint:
                    type: string
                    example: "Ask an administrator to add you to one of: staff-security,
                      super_admins."
                  stepUp:
                    type: object
                    properties:
                      requiredAal:
                        type: string
                        example: aal2
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
    post:
      tags:
        - api-keys
      description: Create a personal API key acting as you, bound to no organization.
        Without `scopes` it carries all your permissions as they are at each
        call; with them, that subset of what you hold (still re-checked at each
        call). Expiry at most 30 days, or the administrator's shorter maximum
        (the default). Returns the key ONCE. 403 when your groups may not use
        MCP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 200
                scopes:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: A subset of the permissions you hold (GET /api/me/api-keys/scopes);
                    absent = all of them, as they are at each call
                allow_step_up_actions:
                  type: boolean
                  description: "Default true: the second factor proven when creating the key
                    stands in for step-up on publish, email change and group
                    grants (30 days max). false: the key can never do step-up
                    actions."
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  description: At most the maximum an administrator set (30 days or less); absent
                    = that maximum
              additionalProperties: false
      x-access: self
      responses:
        "201":
          description: Returned ONCE on creation. Copy the key now — it cannot be
            retrieved again.
          content:
            application/json:
              schema:
                type: object
                description: Returned ONCE on creation. Copy the key now — it cannot be
                  retrieved again.
                properties:
                  client_id:
                    type: string
                  organization_id:
                    type: string
                    nullable: true
                    description: "null: a personal key belongs to no organization (older keys may
                      still name one; it means nothing now)"
                  label:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  created_by:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
                    format: date-time
                    nullable: true
                  last_used_at:
                    type: string
                    format: date-time
                    nullable: true
                    description: Last use, to the minute; null when never seen
                  created_by_email:
                    type: string
                    nullable: true
                    description: The creator, when you are them or may see users
                  kind:
                    type: string
                    enum:
                      - personal
                  all_permissions:
                    type: boolean
                    description: The key carries all your permissions as they are at each call;
                      `scopes` is then empty
                  client_secret:
                    type: string
                    description: Shown only once
                  key:
                    type: string
                    description: "Shown only once: stk_mcp_<client_id>.<secret>, the header value an
                      MCP client sends"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
                    additionalProperties: true
                  code:
                    type: string
                  reason:
                    type: string
                  permission:
                    type: string
                    example: users:reset_second_factor
                  missing:
                    type: array
                    items:
                      type: string
                    example:
                      - users:reset_second_factor
                  missingByScope:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  grantedBy:
                    type: array
                    items:
                      type: string
                    example:
                      - staff-security
                      - super_admins
                  reasons:
                    type: array
                    items:
                      type: string
                    example:
                      - missing_every_org_permissions
                      - missing_permissions
                  hint:
                    type: string
                    example: "Ask an administrator to add you to one of: staff-security,
                      super_admins."
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  details:
                    type: object
                    additionalProperties: true
                  code:
                    type: string
                  reason:
                    type: string
                  permission:
                    type: string
                    example: users:reset_second_factor
                  missing:
                    type: array
                    items:
                      type: string
                    example:
                      - users:reset_second_factor
                  missingByScope:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  grantedBy:
                    type: array
                    items:
                      type: string
                    example:
                      - staff-security
                      - super_admins
                  reasons:
                    type: array
                    items:
                      type: string
                    example:
                      - missing_every_org_permissions
                      - missing_permissions
                  hint:
                    type: string
                    example: "Ask an administrator to add you to one of: staff-security,
                      super_admins."
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service Unavailable
                  reason:
                    type: string
                  message:
                    type: string
  /api/me/api-keys/scopes:
    get:
      tags:
        - api-keys
      description: "The permissions you may narrow a personal key to: the jinbe
        permissions you hold (from your groups), concrete — a wildcard is
        expanded to the permissions the routes declare, never offered as such —
        and never one that only opens routes a key may not use. Grouped by
        resource. 403 when your groups may not use MCP."
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  scopes:
                    type: array
                    items:
                      type: object
                      properties:
                        scope:
                          type: string
                          description: A jinbe permission you hold (resource:verb), concrete — never a
                            wildcard
                        group:
                          type: string
                          description: Its resource root, for a grouped checklist
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
