                properties:
                  error:
                    type: string
                    example: Forbidden
                  message:
                    type: string
                  code:
                    type: string
                    example: insufficient_scope
                  reason:
                    type: string
                    example: scope_missing:users:recovery
                  permission:
                    type: string
                    example: users:reset_second_factor
                  missing:
                    type: array
                    items:
                      type: string
                    example:
                      - users:reset_second_factor
                  missingByScope:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  grantedBy:
                    type: array
                    items:
                      type: string
                    example:
                      - staff-security
                      - super_admins
                  reasons:
                    type: array
                    items:
                      type: string
                    example:
                      - missing_every_org_permissions
                      - missing_permissions
                  hint:
                    type: string
                    example: "Ask an administrator to add you to one of: staff-security,
                      super_admins."
                  stepUp:
                    type: object
                    properties:
                      requiredAal:
                        type: string
                        example: aal2
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "503":
          description: Default Response
