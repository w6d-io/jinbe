  /api/admin/recert/campaigns:
    post:
      tags:
        - recert
      description: "Create a recertification campaign (draft). Phase 1: explicit
        reviewer emails, one-shot schedule."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - reviewers
                - deadline
                - onExpiry
              properties:
                name:
                  type: string
                  minLength: 1
                scope:
                  type: object
                  properties:
                    groups:
                      type: array
                      items:
                        type: string
                  additionalProperties: false
                reviewers:
                  type: array
                  items:
                    type: string
                    format: email
                  minItems: 1
                deadline:
                  type: string
                onExpiry:
                  type: string
                  enum:
                    - revoke
                    - flag
      x-permission: recert:manage
      x-scope: platform
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    get:
      tags:
        - recert
      description: List recertification campaigns with item progress (newest first).
      x-permission: recert:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
  /api/admin/recert/campaigns/{id}:
    get:
      tags:
        - recert
      description: Get a campaign with its review items.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
    delete:
      tags:
        - recert
      description: Delete a campaign. Draft/archived only — completed campaigns and
        their frozen reports are audit evidence.
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:delete
      x-scope: platform
      responses:
        "200":
          description: Default Response
  /api/admin/recert/campaigns/{id}/activate:
    post:
      tags:
        - recert
      description: "Activate a draft campaign: walk groups→members via Kratos and
        generate one review item per (user, group) in scope."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:manage
      x-scope: platform
      x-step-up: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
                  itemCount:
                    type: number
  /api/admin/recert/campaigns/{id}/close:
    post:
      tags:
        - recert
      description: "Close an active campaign now: pending items get the onExpiry
        consequence (revoke → membership removed in Kratos, flag → marked) and
        the completion report is frozen."
      parameters:
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:manage
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    type: object
                    additionalProperties: true
  /api/admin/recert/campaigns/{id}/items:
    get:
      tags:
        - recert
      description: List a campaign's review items. Optional ?decision= and ?reviewer=
        filters; offset/limit pagination.
      parameters:
        - schema:
            type: string
            enum:
              - pending
              - approved
              - revoked
          in: query
          name: decision
          required: false
        - schema:
            type: string
          in: query
          name: reviewer
          required: false
        - schema:
            type: number
            minimum: 0
            default: 0
          in: query
          name: offset
          required: false
        - schema:
            type: number
            minimum: 1
            maximum: 500
            default: 100
          in: query
          name: limit
          required: false
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  total:
                    type: number
  /api/admin/recert/campaigns/{id}/report:
    get:
      tags:
        - recert
      description: Frozen completion report (written once at close) — counters,
        per-reviewer completion, full item list, compliance header (ISO 27001
        A.9.2.5 / SOC 2 CC6.2–CC6.3).
      parameters:
        - schema:
            type: string
            enum:
              - json
          in: query
          name: format
          required: false
        - schema:
            type: string
          in: path
          name: id
          required: true
      x-permission: recert:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/admin/recert/items/{campaignId}/{itemId}/decision:
    post:
      tags:
        - recert
      description: Record a decision on a review item (assigned reviewer or admin).
        revoke requires a comment and is applied immediately (membership removed
        in Kratos). Self-review is blocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - approved
                    - revoked
                comment:
                  type: string
                  maxLength: 2000
      parameters:
        - schema:
            type: string
          in: path
          name: campaignId
          required: true
        - schema:
            type: string
          in: path
          name: itemId
          required: true
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: object
                    additionalProperties: true
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/webhooks/kratos:
    post:
      tags:
        - webhooks
      description: Kratos after-hook receiver (login / MFA / settings / registration).
        Self-authenticated via shared secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      x-access: machine
      x-edge: false
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
  /api/webhooks/kratos/guard:
    post:
      tags:
        - webhooks
        - sign-in-protection
      description: "Interrupting Kratos web_hook (registration after.<method> and
        settings after.profile with response.parse, login after with
        can_interrupt): 200 lets the flow go on (with an identity.traits patch
        when protected traits are dropped or put back), 400 stops it with a form
        message. Self-authenticated via shared secret."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      x-access: machine
      x-edge: false
      responses:
        "200":
          description: Default Response
