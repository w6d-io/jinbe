  /api/admin/users/{id}/access:
    get:
      tags:
        - admin
      description: "A user's site access (groups → roles per service) and org access
        (per org: the org roles assigned there and the org permissions held
        there, as OPA decides them), and secondFactor (requiredBecause,
        enrolled, stepUpPermissions; session fields null). Needs access:read."
      parameters:
        - schema:
            type: string
            maxLength: 128
          in: path
          name: id
          required: true
      x-permission: access:read
      x-scope: platform
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  site:
                    type: object
                    properties:
                      groups:
                        type: array
                        items:
                          type: string
                      byService:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                  orgs:
                    type: array
                    items:
                      type: object
                      properties:
                        orgId:
                          type: string
                        name:
                          type: string
                        roles:
                          type: array
                          items:
                            type: string
                          description: Org roles assigned here (svc:role)
                        permissions:
                          type: array
                          items:
                            type: string
                          description: Org permissions held here (OPA rbac.org_permissions_by_org)
                  secondFactor:
                    type: object
                    nullable: true
                    description: "required/requiredBecause: the groups that make two-step sign-in
                      (aal2) mandatory; enrolled/methods: null when unread;
                      currentAal, factorAgeMin, stepUpFresh: the caller's own
                      session (null when describing somebody else);
                      stepUpPermissions: their permissions that need a second
                      factor proven within 15 minutes (null when unread)."
                    properties:
                      required:
                        type: boolean
                      requiredBecause:
                        type: array
                        items:
                          type: string
                      enrolled:
                        type: boolean
                        nullable: true
                      methods:
                        type: array
                        nullable: true
                        items:
                          type: string
                      currentAal:
                        type: string
                        nullable: true
                      factorAgeMin:
                        type: integer
                        nullable: true
                      stepUpFresh:
                        type: boolean
                        nullable: true
                      stepUpPermissions:
                        type: array
                        nullable: true
                        items:
                          type: string
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  code:
                    type: string
                    example: authentication_required
                  message:
                    type: string
                    example: Valid authentication required. Please provide a valid
                      ory_kratos_session cookie.
        "403":
