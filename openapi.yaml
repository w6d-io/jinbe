                          properties:
                            setting:
                              type: string
                            docs:
                              type: string
                          required:
                            - setting
                            - docs
                          additionalProperties: false
                      required:
                        - state
                      additionalProperties: false
                  connect:
                    $ref: "#/properties/sources/additionalProperties/properties/connect"
                  data: {}
                required:
                  - status
                  - asOf
                  - stale
                  - sources
                additionalProperties: false
        "400":
