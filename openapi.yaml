  /api/admin/rbac/explain-route:
    post:
      tags:
        - rbac
      description: "Why jinbe accepts or refuses METHOD PATH for the caller (or
        `subject`, which needs access:check): the route and its guards, the
        catalogue permission, the delegation gate, platform holdings, OPA
        rbac.decision with the guard's exact input (and rbac.explain: which
        clause fired), the org trail (membership, the org roles assigned there,
        org permissions held there, entitled sites), and the real guards run in
        a dry run. `disagreements` lists surfaces that answer the same question
        differently."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - method
                - path
              properties:
                method:
                  type: string
                  description: GET, POST, PUT, PATCH, DELETE, HEAD or OPTIONS (any case)
                path:
                  type: string
                  description: Absolute jinbe path, no query string, e.g.
                    /api/organizations/3cb9…/users
                subject:
                  type: string
                  description: Identity id or address; default the caller. Anybody else needs
                    access:check
                via:
                  type: string
                  enum:
                    - session
                    - delegated
                    - machine
                  description: Pose the question for this way in; default as the caller is calling
                aal:
                  type: string
                  enum:
                    - aal1
                    - aal2
                  description: Sign-in level for a session
                scopes:
                  type: array
                  items:
                    type: string
                  description: A delegated caller's token scopes; default the caller's own, or
                    what a personal key of the subject would carry
                clientId:
                  type: string
                body:
                  type: object
                  additionalProperties: true
                  description: The request body, for guards that read it (a create, an edit)
      x-access: self
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      via:
                        type: string
                      aal:
                        type: string
                      client:
                        type: boolean
                        description: What the guards pass OPA as `client` (a token, not a session)
                      scopes:
                        type: array
                        items:
                          type: string
                  route:
                    type: object
                    properties:
                      method:
                        type: string
                      path:
                        type: string
                      pattern:
                        type:
                          - "null"
                          - string
                      params:
                        type: object
                        additionalProperties:
                          type: string
                  verdict:
                    type: object
                    description: "What the caller gets from the guards: 200 when all pass (the
                      handler may still refuse)"
                    properties:
                      status:
                        type: integer
                      allowed:
                        type: boolean
                      code:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                  decidedBy:
                    type: string
                    description: The guard that answered, or `handler`
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        step:
                          type: string
                          enum:
                            - route
                            - catalogue
                            - delegation
                            - platform
                            - opa
                            - org
                            - guard
                        verdict:
                          type: string
                          enum:
                            - pass
                            - refuse
                            - info
                            - skipped
                            - unavailable
                        input:
                          type: object
                          additionalProperties: true
                        detail:
                          type: object
                          additionalProperties: true
                      required:
                        - step
                        - verdict
                        - detail
                  disagreements:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                        between:
                          type: array
                          items:
                            type: string
                        detail:
                          type: string
                required:
                  - subject
                  - route
                  - verdict
                  - decidedBy
                  - steps
                  - disagreements
        "400":
          description: Default Response
          content:
            application/json:
