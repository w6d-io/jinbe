  /api/organizations/{organizationId}/api-keys:
    post:
      tags:
        - api-keys
      description: Create an API key (Hydra client_credentials client) for this
        organization. Returns client_id + client_secret ONCE. organization_id is
        enforced server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
                - scopes
              properties:
                label:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Human label for the key
                scopes:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  description: Requested scopes (validated against the allowed catalog)
                audience:
                  type: array
                  items:
                    type: string
                  description: Optional token audience
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  description: Optional expiry in days; absent = never expires
              additionalProperties: false
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: organizationId
          required: true
          description: Organization identifier
      x-permission: org.keys:write
      x-scope: org
      x-org-param: organizationId
      x-step-up: true
      responses:
        "201":
          description: Returned ONCE on creation. Copy the client_secret now — it cannot
            be retrieved again.
          content:
            application/json:
              schema:
                type: object
                description: Returned ONCE on creation. Copy the client_secret now — it cannot
                  be retrieved again.
                properties:
                  client_id:
                    type: string
                  organization_id:
                    type: string
                    format: uuid
                  label:
                    type: string
                  scopes:
                    type: array
                    items:
                      type: string
                  created_by:
                    type: string
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                    nullable: true
                  expires_at:
                    type: string
