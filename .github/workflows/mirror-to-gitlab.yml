# GitHub stays the source. This pushes our own branches to GitLab so its pipeline runs against our
# templates and registries, which GitHub Actions cannot reach. gitlab.w6d.io is Community Edition, so
# pull mirroring is unavailable and the push has to come from here.
name: Mirror to GitLab

on:
  push:
    # library/stages only produces a pipeline for these prefixes; 'feat/' yields nothing at all.
    branches: ['feature/**', 'hotfix/**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A shallow clone is rejected by the receiving end.
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_MIRROR_TOKEN }}
          GITLAB_REPO: ${{ vars.GITLAB_MIRROR_REPO }}
        run: |
          set -euo pipefail
          git push "https://oauth2:${GITLAB_TOKEN}@${GITLAB_REPO}" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}"
