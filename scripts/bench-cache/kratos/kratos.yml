version: v1.3.0
dsn: memory
serve:
  public: { base_url: http://127.0.0.1:14433/ }
  admin: { base_url: http://127.0.0.1:14434/ }
selfservice:
  default_browser_return_url: http://127.0.0.1:14433/
  methods:
    password: { enabled: true }
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json
log: { level: warning }
secrets:
  cookie: [bench-cookie-secret-0123456789abcdef]
  cipher: [bench-cipher-secret-0123456789ab]
