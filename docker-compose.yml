services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jinbe
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_URL: redis://redis:6379
      DATABASE_URL: mongodb://mongo:27017/jinbe
      OPA_URL: http://opa:8181
      OPA_TOKEN: local-dev-opa-token-0123456789abcdef
      RATE_LIMIT_MAX: '10000'
      GATEKIT_URL: http://gatekit:8080
      OPA_DATA_URL: http://opa:8181
      DEV_BYPASS_AUTH: '${DEV_BYPASS_AUTH:-true}'
      DEV_USER_EMAIL: dev@localhost.dev
      ENCRYPTION_KEY: dev-encryption-key-minimum-32-characters!!
      ENABLE_SWAGGER: 'true'
      LOG_LEVEL: debug
      AUTH_DOMAIN: auth.localhost.dev
      APP_DOMAIN: app.localhost.dev
      API_DOMAIN: api.localhost.dev
      LOGIN_UI_URL: http://localhost:3001
      ADMIN_UI_URL: http://localhost:5173
      KRATOS_ADMIN_URL: http://kratos:4434
      KRATOS_PUBLIC_URL: http://kratos:4433
      ADMIN_EMAIL: dev@localhost.dev
      ADMIN_PASSWORD: dev-local-bootstrap-secret!!
      # Same kratos.yml the local Kratos container watches (kratos-login-ui
      # compose) — enables the /api/admin/auth/methods hot-reload toggles.
      KRATOS_CONFIG_PATH: /etc/kratos-config/kratos.yml
      # Mirrors the authenticators enabled in the local oathkeeper container
      # (oathkeeper/oathkeeper.yml) so fail-closed rule validation matches it.
      OATHKEEPER_ENABLED_AUTHENTICATORS: cookie_session,noop,bearer_token,oauth2_introspection
      OATHKEEPER_ENABLED_AUTHORIZERS: allow,deny,remote_json
      # Sites + Gateway against the local kind cluster (dev/kind/README.md, `dev/kind/up.sh`): the
      # chart's jinbe ServiceAccount token, not cluster-admin. Without the cluster, Sites apply and the
      # Gateway page answer 503 kubernetes_unavailable; SITES_KUBE=off docker compose up … opts out.
      SITES_KUBE: '${SITES_KUBE:-kubeconfig}'
      KUBECONFIG: /kind/kubeconfig
      SITES_NAMESPACE: auth
      SITES_ENV: local
      SITES_RESERVED_HOSTS: auth.sites.localtest.me,kuma.sites.localtest.me
      SITES_PLATFORM_NAMESPACES: auth,kube-system,kube-public,kube-node-lease,ingress-nginx,local-path-storage
      SITES_ACCESS_URL: http://localhost:3001/access
      SITES_ZONE_ALLOWED_PARENTS: localtest.me
      SITES_INGRESS_ADDRESSES: 127.0.0.1
      GATEWAY_OATHKEEPER_CONFIGMAP: auth-oathkeeper-config-base
      # Legacy rules stay on the compose oathkeeper (:4455), Site rules on kind's: they coexist
      # without a migration cut-over (as the sandbox, SITES_MIXED_GATEWAY; preview refuses overlaps).
      SITES_MIXED_GATEWAY: 'true'
      # OPAL data routes require it. Local dev value only.
      OPAL_CLIENT_TOKEN: local-dev-opal-client-token-0123456789abcdef
      # Where the datasource manifest tells OPAL to fetch each entry (default jinbe:8080 is the chart's).
      JINBE_INTERNAL_URL: http://api:3000
      # Told to have every OPAL client refetch after each RBAC change.
      OPAL_SERVER_URL: http://opal-server:7002
    volumes:
      - ../kratos-login-ui/examples/kratos:/etc/kratos-config
      # the jinbe ServiceAccount kubeconfig written by dev/kind/up.sh (nothing else of dev/kind)
      - ./dev/kind/jinbe:/kind:ro
    # Match the host user so jinbe can write the bind-mounted kratos.yml.
    user: '${DEV_UID:-1000}:${DEV_GID:-1000}'
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
      - opa
    restart: unless-stopped
    networks:
      - jinbe-network

  gatekit:
    image: gatekit:local
    container_name: jinbe-gatekit
    restart: unless-stopped
    networks:
      - jinbe-network

  redis:
    image: redis:7-alpine
    container_name: jinbe-redis
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - jinbe-network

  # Local copy of the cluster's authorization engine: a real OPAL server + client (same 0.7.12 as the
  # chart), not a bare OPA. The server serves the opal-policies checkout's `develop` branch (commits,
  # not the working tree) and points clients at jinbe's datasource manifest; the client loads the rego
  # one module at a time into its inline OPA, exactly as in dev. Service stays `opa` so jinbe's OPA_URL
  # is unchanged. The engine refuses any call without OPA_TOKEN (dev/opal/authz.rego).
  opal-server:
    image: permitio/opal-server:0.7.12
    container_name: jinbe-opal-server
    environment:
      UVICORN_NUM_WORKERS: '1'
      OPAL_POLICY_REPO_URL: file:///policy-repo
      OPAL_POLICY_REPO_MAIN_BRANCH: develop
      OPAL_POLICY_REPO_POLLING_INTERVAL: '5'
      OPAL_DATA_CONFIG_SOURCES: '{"external_source_url":"http://api:3000/api/admin/rbac/opal-datasource"}'
    volumes:
      - ${OPAL_POLICIES_DIR:-../../../gitlab.example.com/infra/opal-policies}:/policy-repo:ro
    restart: unless-stopped
    networks:
      - jinbe-network

  opa:
    image: permitio/opal-client:0.7.12
    container_name: jinbe-opa
    ports:
      - '8181:8181'
    environment:
      UVICORN_NUM_WORKERS: '1'
      OPAL_SERVER_URL: http://opal-server:7002
      OPAL_CLIENT_TOKEN: local-dev-opal-client-token-0123456789abcdef
      OPAL_DATA_UPDATER_ENABLED: 'True'
      OPAL_POLICY_STORE_AUTH_TYPE: token
      OPAL_POLICY_STORE_AUTH_TOKEN: local-dev-opa-token-0123456789abcdef
      OPAL_INLINE_OPA_CONFIG: '{"addr":"0.0.0.0:8181","authentication":"token","authorization":"basic","files":["/opal-dev/authz.rego"]}'
    volumes:
      - ./dev/opal:/opal-dev:ro
    depends_on:
      - opal-server
    restart: unless-stopped
    networks:
      - jinbe-network

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    container_name: jinbe-oathkeeper
    command: serve --config /etc/config/oathkeeper/oathkeeper.yml
    ports:
      - '4455:4455'
      - '4456:4456'
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - jinbe-network

  mongo:
    image: mongo:7
    container_name: jinbe-mongo
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - jinbe-network

volumes:
  redis_data:
  mongo_data:

networks:
  jinbe-network:
    driver: bridge
