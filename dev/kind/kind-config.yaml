# kind cluster `auth-local` (created by up.sh with its own kubeconfig file, never ~/.kube/config).
# - apiServerPort: fixed so the compose jinbe's kubeconfig stays valid across re-creates
# - certSANs: jinbe (compose container) dials https://host.containers.internal:<port>
# - ingress-nginx listens on the node's :80, published on the host's ${HTTP_PORT} (80 by default:
#   Oathkeeper matches the Host header, port included), so http://<host>.sites.localtest.me reaches it
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: auth-local
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: ${API_PORT}
nodes:
- role: control-plane
  labels:
    ingress-ready: "true"
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      certSANs: [localhost, 127.0.0.1, host.containers.internal, host.docker.internal]
  extraPortMappings:
  - containerPort: 80
    hostPort: ${HTTP_PORT}
    # macOS lets gvproxy (unprivileged) bind port 80 on all interfaces only, not on 127.0.0.1:
    # the sites are reachable from the LAN too (through Oathkeeper, like any site)
    listenAddress: ${HTTP_LISTEN}
    protocol: TCP
